services:
  instrument-training-home-backend:
    build:
      context: ./instrument-training-home
      dockerfile: Dockerfile.backend
    container_name: instrument_train_backend
    ports:
      - "8000:8000"
    volumes:
      - ./instrument-training-home/data:/app/data
    env_file:
      - ./instrument-training-home/.env
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - projects-network

  instrument-training-home-frontend:
    build:
      context: ./instrument-training-home
      dockerfile: Dockerfile.frontend
    container_name: instrument_train_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://instrument-training-home-backend:8000
    depends_on:
      instrument-training-home-backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - projects-network

  subi-backend:
    build:
      context: ./subi_knowledge_platform
      dockerfile: Dockerfile.backend
    container_name: subi_backend
    ports:
      - "8001:8001"
    volumes:
      - ./subi_knowledge_platform/data:/app/data
      - ./subi_knowledge_platform/uploads:/app/uploads
    env_file:
      - ./subi_knowledge_platform/.env
      - ./subi_knowledge_platform/.env.integration
    environment:
      - PYTHONUNBUFFERED=1
      - INSTRUMENT_TRAINING_API_BASE=http://instrument-training-home-backend:8000/api/v1
    depends_on:
      instrument-training-home-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - projects-network

  subi-frontend:
    build:
      context: ./subi_knowledge_platform/frontend
      dockerfile: Dockerfile
    container_name: subi_frontend
    ports:
      - "8510:8510"
    environment:
      - PYTHONUNBUFFERED=1
      - API_BASE=http://subi-backend:8001
    depends_on:
      subi-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8510/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - projects-network

  # 临床研究检测排程甘特图（静态 SPA / nginx）
  # 部署前在 gantt-chart 目录执行：npm ci && npm run build（产出 dist/）
  gantt-chart:
    image: nginx:1.27-alpine
    container_name: gantt_chart
    ports:
      - "8520:80"
    volumes:
      - ./gantt-chart/dist:/usr/share/nginx/html:ro
      - ./gantt-chart/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - projects-network

networks:
  projects-network:
    driver: bridge
