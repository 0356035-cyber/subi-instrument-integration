# ZSpace / older docker compose compatible overlay
# Usage: docker compose -f docker-compose.yml -f docker-compose.zspace.yml up -d --no-build

services:
  subi-backend:
    env_file:
      - ./subi_knowledge_platform/.env
    environment:
      - SUBI_DATA_PROFILE=production

  subi-frontend:
    depends_on:
      - subi-backend